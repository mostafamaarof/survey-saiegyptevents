<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Survey Admin · SAI Egypt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0a2540;--ink-soft:#28415f;--blue:#135ca8;--blue-strong:#0f4e8f;--sky:#2b9ef0;
    --sky-light:#e8f3fd;--sky-tint:#f4f9fe;--line:#d7e3f0;--line-soft:#e9f0f8;--bg:#eef4fb;
    --surface:#fff;--muted:#607a96;--ok:#1f9d6b;--warn:#c7702a;--err:#cf3b4d;
    --shadow:0 1px 2px rgba(10,37,64,.04),0 8px 30px rgba(10,37,64,.07);--serif:"Source Serif 4",serif;--sans:"Inter",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--blue);text-decoration:none}
  .serif{font-family:var(--serif)}
  /* login */
  .login{min-height:100vh;display:grid;place-items:center;padding:22px;
    background-image:radial-gradient(900px 500px at 80% 0%,rgba(43,158,240,.12),transparent 60%)}
  .login .box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:40px 36px;box-shadow:var(--shadow);width:100%;max-width:380px;text-align:center}
  .login .mark{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--sky));display:grid;place-items:center;color:#fff;font-family:var(--serif);font-weight:700;font-size:25px;margin:0 auto 20px}
  .login h1{font-family:var(--serif);font-size:22px;margin-bottom:6px}
  .login p{color:var(--muted);font-size:13.5px;margin-bottom:22px}
  input,textarea{font-family:inherit;font-size:14.5px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;width:100%;transition:.16s}
  input:focus,textarea:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 4px var(--sky-light)}
  .btn{font-family:var(--sans);font-size:14px;font-weight:600;border-radius:10px;padding:11px 20px;cursor:pointer;border:1.5px solid transparent;transition:.16s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
  .btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-strong)}
  .btn-ghost{background:#fff;color:var(--ink-soft);border-color:var(--line)}.btn-ghost:hover{background:var(--sky-tint)}
  .btn-sm{padding:7px 13px;font-size:12.5px;border-radius:8px}
  .btn:disabled{opacity:.5;cursor:default}
  .err{color:var(--err);font-size:13px;margin-top:10px;min-height:18px}
  /* app */
  header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .hd{max-width:1180px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:13px}
  .hd .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--sky));display:grid;place-items:center;color:#fff;font-family:var(--serif);font-weight:700}
  .hd b{font-size:15px}.hd .sp{flex:1}
  select{font-family:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;color:var(--ink);cursor:pointer}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 24px 80px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px}
  .tabs button{border:0;background:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);padding:11px 16px;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px}
  .tabs button.on{color:var(--blue);border-color:var(--blue)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:28px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
  .tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:8px}
  .tile .v{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1}
  .tile .v small{font-size:15px;color:var(--muted);font-weight:400}
  .tile.accent{background:linear-gradient(135deg,var(--blue),var(--sky));border:0;color:#fff}
  .tile.accent .k{color:rgba(255,255,255,.8)}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:18px}
  .card h3{font-family:var(--serif);font-size:16px;margin-bottom:4px}
  .card .qtext{font-size:14px;color:var(--ink-soft);margin-bottom:14px;font-weight:500}
  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:9px;font-size:13.5px}
  .bar-row .bl{flex:0 0 42%;color:var(--ink-soft)}
  .bar-row .bt{flex:1;background:var(--line-soft);border-radius:6px;height:22px;overflow:hidden;position:relative}
  .bar-row .bf{height:100%;background:linear-gradient(90deg,var(--blue),var(--sky));border-radius:6px;min-width:2px;transition:width .5s}
  .bar-row .bn{flex:none;font-weight:600;font-size:13px;min-width:54px;text-align:end;color:var(--ink)}
  .txtlist{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow:auto}
  .txtlist .ti{background:var(--sky-tint);border:1px solid var(--line-soft);border-radius:9px;padding:9px 12px;font-size:13.5px;color:var(--ink-soft)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600}
  .pill.pending{background:#eef2f7;color:#6b7f96}
  .pill.started{background:#fff3e2;color:var(--warn)}
  .pill.completed{background:#e4f6ee;color:var(--ok)}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}
  .copy{cursor:pointer;color:var(--blue);font-size:12px;font-weight:600}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:620px){.grid2{grid-template-columns:1fr}.bar-row .bl{flex-basis:34%}}
  label.fl{font-size:12.5px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:5px}
  .muted{color:var(--muted);font-size:13px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;opacity:0;transition:.3s;z-index:60;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---- survey management ---- */
  .pill.closed{background:#fde8ea;color:var(--err)}
  .copy.danger-t{color:var(--err)}
  select{max-width:100%}
  .chk{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft);cursor:pointer}
  .chk input{width:auto;accent-color:var(--blue)}
  input[type=datetime-local]{width:auto}
  .banner{border-radius:12px;padding:12px 16px;font-size:13.5px;margin-bottom:16px;border:1px solid var(--line)}
  .banner ul{margin:6px 0 0 18px}
  .warn-b{background:#fff7ec;border-color:#f3d9b8;color:#7a4a14}
  .err-b{background:#fdecee;border-color:#f1c2c8;color:#8c2433}
  .info-b{background:var(--sky-tint);border-color:var(--line);color:var(--ink-soft)}
  .statusbar{padding:14px 20px}
  .modal-bg{position:fixed;inset:0;background:rgba(10,37,64,.45);z-index:70;display:grid;place-items:center;padding:20px}
  .modal{background:#fff;border-radius:16px;box-shadow:0 24px 70px rgba(10,37,64,.35);width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column}
  .modal.wide{max-width:1000px;height:90vh}
  .modal-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
  .modal-hd h3{font-size:17px}
  .modal-body{padding:18px 20px;overflow:auto;flex:1;min-height:0}
  .modal.wide .modal-body{padding:0;display:flex}
  .modal-body iframe{flex:1;width:100%;height:100%;border:0;border-radius:0 0 16px 16px;background:var(--bg)}
  .ed-bar{position:sticky;top:61px;z-index:15;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bg);padding:10px 0 12px}
  .ed-sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:18px}
  .ed-sec-hd,.ed-q-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .ed-sec-hd .sp,.ed-q-hd .sp{flex:1}
  .ed-q{background:var(--sky-tint);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px;margin-top:12px}
  .ed-q.is-hidden{opacity:.65;border-style:dashed}
  .q-n{font-family:var(--serif);font-weight:700;color:var(--blue)}
  .ed-list{margin-top:10px;padding:10px 12px;background:#fff;border:1px solid var(--line-soft);border-radius:10px}
  .ed-list-hd{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;margin-bottom:8px}
  .ed-ent{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .ed-ent input[data-bind]:not([type=checkbox]){flex:1;min-width:140px}
  .ib{border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .ib:hover:not(:disabled){background:var(--sky-tint)}
  .ib:disabled{opacity:.4;cursor:not-allowed}
  .ib.danger{color:var(--err)}
  details>summary{cursor:pointer}
  #verBox table td,#verBox table th{padding:8px 10px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="/config.js"></script>
<script>
(function(){
  "use strict";
  var API=String(window.SURVEY_API||'').replace(/\/+$/,'');
  var app=document.getElementById('app');
  var TOKEN=sessionStorage.getItem('scei_admin_token')||'';
  var DATA=null, current=null, tab='overview';

  var DefCheck=null;            // /definition.js — the validator shared with the Worker
  var skew=0;                   // server clock minus browser clock, learned from API responses
  var ED=null;                  // question-editor state (kept while switching tabs)
  var previewListener=null;
  function nowMs(){ return Date.now()+skew; }

  function api(path,opts){
    opts=opts||{}; opts.headers=opts.headers||{};
    opts.headers['Authorization']='Bearer '+TOKEN;
    if(opts.body){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(opts.body);}
    return fetch(API+path,opts).then(function(r){
      return r.json().catch(function(){return {};}).then(function(j){
        if(r.status===401){ logout(); var e=new Error('unauthorized'); e.status=401; throw e; }
        if(!r.ok){ var er=new Error(j.message||j.error||('HTTP '+r.status)); er.status=r.status; er.body=j; throw er; }
        if(j && j.server_now){ var sn=Date.parse(j.server_now); if(!isNaN(sn)) skew=sn-Date.now(); }
        return j;
      });
    },function(){ var e=new Error('Cannot reach the server'); e.network=true; throw e; });
  }
  function logout(){ sessionStorage.removeItem('scei_admin_token'); TOKEN=''; ED=null; renderLogin(); }
  function toast(m,ms){var e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(function(){e.classList.remove('show');},ms||2200);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function errText(e){ return (e && e.message) || 'Unexpected error'; }

  /* ---------- Cairo time helpers ---------- */
  function cparts(iso,monthStyle){
    var d=new Date(iso); if(isNaN(d.getTime())) return null; var p={};
    new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo',year:'numeric',month:monthStyle||'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'})
      .formatToParts(d).forEach(function(x){p[x.type]=x.value;});
    return p;
  }
  function fmtCairo(iso){ var p=cparts(iso,'short'); return p? p.day+' '+p.month+' '+p.year+', '+p.hour+':'+p.minute+' (Cairo)' : ''; }
  function cairoInput(iso){ var p=cparts(iso); return p? p.year+'-'+p.month+'-'+p.day+'T'+p.hour+':'+p.minute : ''; }
  // { cls, text } describing whether a survey currently accepts responses.
  function statusInfo(sv){
    if(sv.status==='draft') return {cls:'pending',text:'Draft — not accepting responses'};
    if(sv.status==='closed') return {cls:'closed',text:'Closed manually'};
    if(sv.deadline){
      var ms=Date.parse(sv.deadline)-nowMs();
      if(ms<0) return {cls:'closed',text:'Closed — deadline passed on '+fmtCairo(sv.deadline)};
      var days=Math.ceil(ms/864e5), hrs=Math.max(1,Math.ceil(ms/36e5));
      return {cls:'completed',text:'Open — closes in '+(ms<864e5? hrs+' hour'+(hrs===1?'':'s') : days+' day'+(days===1?'':'s'))+' ('+fmtCairo(sv.deadline)+')'};
    }
    return {cls:'completed',text:'Open — no deadline'};
  }
  function statusPill(sv){ var s=statusInfo(sv); return '<span class="pill '+s.cls+'">'+esc(s.text)+'</span>'; }

  /* ---------- modal ---------- */
  function openModal(title,bodyHtml,wide){
    closeModal();
    var bg=document.createElement('div'); bg.className='modal-bg'; bg.id='modalBg';
    bg.innerHTML='<div class="modal'+(wide?' wide':'')+'"><div class="modal-hd"><h3 class="serif">'+esc(title)+'</h3><button class="btn btn-ghost btn-sm" id="modalX">Close</button></div><div class="modal-body">'+bodyHtml+'</div></div>';
    document.body.appendChild(bg);
    bg.addEventListener('mousedown',function(e){ if(e.target===bg) closeModal(); });
    document.getElementById('modalX').onclick=closeModal;
    return bg.querySelector('.modal-body');
  }
  function closeModal(){
    var b=document.getElementById('modalBg'); if(b) b.remove();
    if(previewListener){ window.removeEventListener('message',previewListener); previewListener=null; }
  }
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeModal(); });

  /* ---------- login ---------- */
  function renderLogin(msg){
    app.innerHTML='<div class="login"><div class="box">'+
      '<div class="mark serif">S</div><h1 class="serif">Survey Administration</h1>'+
      '<p>Enter your administrator access token to continue.</p>'+
      '<input id="tok" type="password" placeholder="Admin token" autocomplete="current-password">'+
      '<div class="err" id="loginErr">'+(msg||'')+'</div>'+
      '<button class="btn btn-primary" id="loginBtn" style="width:100%;margin-top:6px">Sign in</button>'+
      '</div></div>';
    var go=function(){ TOKEN=document.getElementById('tok').value.trim(); if(!TOKEN)return;
      sessionStorage.setItem('scei_admin_token',TOKEN);
      document.getElementById('loginBtn').disabled=true;
      boot().catch(function(e){
        var el=document.getElementById('loginErr');
        if(el) el.textContent = e && e.network ? 'Cannot reach the server. Check your connection and try again.'
          : (e && e.status===401) ? 'Invalid token. Please try again.' : 'Sign-in failed: '+errText(e);
        var b=document.getElementById('loginBtn'); if(b)b.disabled=false;
      });
    };
    document.getElementById('loginBtn').onclick=go;
    document.getElementById('tok').addEventListener('keydown',function(e){if(e.key==='Enter')go();});
  }

  /* ---------- boot ---------- */
  function pickDefault(list){ var a=list.filter(function(s){return !s.archived;}); return (a[0]||list[0]||{}).slug||null; }
  function boot(){
    return api('/api/admin/bootstrap').then(function(d){
      DATA=d;
      if(!current || !d.surveys.some(function(s){return s.slug===current;})) current=pickDefault(d.surveys);
      return loadSurvey(current);
    });
  }
  function refreshList(){ return api('/api/admin/bootstrap').then(function(d){ DATA.surveys=d.surveys; }); }
  function loadSurvey(slug){
    if(!slug){ DATA.detail=null; renderApp(); return Promise.resolve(); }
    return api('/api/admin/survey/'+encodeURIComponent(slug)).then(function(d){ DATA.detail=d; current=slug; renderApp(); });
  }
  function editorDirty(){ return !!(ED && ED.slug===current && JSON.stringify(ED.draft)!==JSON.stringify(ED.orig)); }
  function confirmDiscard(){ return !editorDirty() || confirm('You have unsaved question edits. Discard them?'); }

  /* ---------- shell ---------- */
  function renderApp(){
    var sorted=DATA.surveys.slice().sort(function(a,b){return (a.archived?1:0)-(b.archived?1:0);});
    var opts=sorted.map(function(s){return '<option value="'+esc(s.slug)+'"'+(s.slug===current?' selected':'')+'>'+esc(s.title)+(s.archived?' (archived)':'')+'</option>';}).join('');
    app.innerHTML=
      '<header><div class="hd"><div class="mark serif">S</div><b>Survey Administration</b>'+
        '<span class="sp"></span>'+
        (DATA.surveys.length?'<select id="surveySel">'+opts+'</select>':'')+
        '<button class="btn btn-primary btn-sm" id="newSurveyBtn">+ New survey</button>'+
        '<button class="btn btn-ghost btn-sm" id="logoutBtn">Sign out</button>'+
      '</div></header><div class="wrap" id="wrap"></div>';
    document.getElementById('logoutBtn').onclick=function(){ if(confirmDiscard()) logout(); };
    document.getElementById('newSurveyBtn').onclick=newSurveyModal;
    var sel=document.getElementById('surveySel');
    if(sel) sel.onchange=function(){
      if(!confirmDiscard()){ this.value=current; return; }
      ED=null; loadSurvey(this.value).catch(function(e){toast(errText(e),4000);});
    };
    renderBody();
  }

  function renderBody(){
    var wrap=document.getElementById('wrap');
    if(!DATA.surveys.length){ wrap.innerHTML='<div class="card"><p class="muted">No surveys found yet. Use <b>+ New survey</b> to create one.</p></div>'; return; }
    var d=DATA.detail; if(!d){wrap.innerHTML='';return;}
    wrap.innerHTML='<div class="tabs">'+
      tabBtn('overview','Overview')+tabBtn('responses','Responses')+tabBtn('invitations','Invitations')+tabBtn('questions','Questions')+tabBtn('settings','Settings')+
      '</div><div id="tabBody"></div>';
    [].forEach.call(wrap.querySelectorAll('.tabs button'),function(b){b.onclick=function(){tab=b.dataset.t;renderBody();};});
    if(tab==='overview')renderOverview(d);
    else if(tab==='responses')renderResponses(d);
    else if(tab==='questions')renderQuestions(d);
    else if(tab==='settings')renderSettings(d);
    else renderInvitations(d);
  }
  function tabBtn(id,label){return '<button data-t="'+id+'" class="'+(tab===id?'on':'')+'">'+label+(id==='questions'&&editorDirty()?' •':'')+'</button>';}

  function newSurveyModal(){
    var dup='<option value="">— Blank survey —</option>'+DATA.surveys.map(function(s){return '<option value="'+esc(s.slug)+'">Duplicate: '+esc(s.title)+'</option>';}).join('');
    var body=openModal('New survey',
      '<label class="fl">URL name (slug)</label><input id="nsSlug" placeholder="e.g. annual-survey-2027" maxlength="64">'+
      '<p class="muted" style="margin:4px 0 12px">Lowercase letters, digits and single hyphens. It cannot be changed later.</p>'+
      '<div class="grid2"><div><label class="fl">Title (English)</label><input id="nsEn" maxlength="200"></div>'+
      '<div><label class="fl">Title (Arabic)</label><input id="nsAr" dir="rtl" maxlength="200"></div></div>'+
      '<label class="fl" style="margin-top:12px">Start from</label><select id="nsDup" style="width:100%">'+dup+'</select>'+
      '<p class="muted" style="margin:6px 0 0">New surveys start as <b>Draft</b>: nobody can answer until you set the status to Active in Settings.</p>'+
      '<div class="err" id="nsErr"></div>'+
      '<div class="row" style="margin-top:8px"><button class="btn btn-primary" id="nsGo">Create survey</button></div>');
    body.querySelector('#nsGo').onclick=function(){
      var btn=this; btn.disabled=true;
      api('/api/admin/survey',{method:'POST',body:{slug:body.querySelector('#nsSlug').value.trim(),title:{en:body.querySelector('#nsEn').value,ar:body.querySelector('#nsAr').value},duplicate_of:body.querySelector('#nsDup').value||undefined}})
        .then(function(r){ closeModal(); return refreshList().then(function(){ ED=null; tab='questions'; return loadSurvey(r.slug); }); })
        .then(function(){ toast('Survey created (draft)'); })
        .catch(function(e){ body.querySelector('#nsErr').textContent=errText(e); btn.disabled=false; });
    };
  }

  /* ---------- overview ---------- */
  function renderOverview(d){
    var invited=d.invitations.length;
    var started=d.invitations.filter(function(i){return i.status==='started';}).length;
    var completed=d.responses.filter(function(r){return r.is_complete;}).length;
    var anon=d.responses.filter(function(r){return !r.invitation_id;}).length;
    var viaLinks=d.responses.filter(function(r){return r.link_id && r.is_complete;}).length;
    var completedInv=d.responses.filter(function(r){return r.invitation_id && r.is_complete;}).length;
    var rate= invited? Math.round(completedInv/invited*100):0;
    var tiles='<div class="tiles">'+
      tile('Invited', invited)+
      tile('Started', d.responses.length - completed + started )+
      tile('Completed', completed)+
      ((d.links&&d.links.length)?tile('Via general links', viaLinks):'')+
      '<div class="tile accent"><div class="k">Completion rate</div><div class="v">'+rate+'<small>%</small></div></div>'+
    '</div>';
    if(anon) tiles=tiles.replace('</div>\n','');
    var body='';
    var defs=flatten(d.definition);
    var resp=d.responses;
    defs.forEach(function(q){
      body+=renderQStats(q,resp,d.definition.default_lang||'en');
    });
    var sbar='<div class="card statusbar"><div class="row" style="justify-content:space-between">'+statusPill(d.survey)+

  }
  function tile(k,v){return '<div class="tile"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>';}

  function renderQStats(q,responses,lang){
    var L=function(o){return o?(o[lang]||o.en||o.ar||''):'';};
    var answered=responses.filter(function(r){return r.answers && r.answers[q.id]!=null && r.answers[q.id]!=='' && !(Array.isArray(r.answers[q.id])&&!r.answers[q.id].length);});
    var head='<div class="card"><h3>'+esc(q.displayNum?('Q'+q.displayNum):'')+(q.hidden?' <span class="pill pending">hidden from respondents</span>':'')+'</h3><div class="qtext">'+esc(L(q.label))+'</div>';
    if(q.type==='single_choice'||q.type==='multiple_choice'||q.type==='yes_no'){
      var opts = q.type==='yes_no'? [{value:'yes',label:{en:'Yes',ar:'نعم'}},{value:'no',label:{en:'No',ar:'لا'}}] : (q.options||[]).slice();
      if(q.allow_other) opts.push({value:'__other__',label:{en:'Other',ar:'أخرى'}});
      var counts={}; opts.forEach(function(o){counts[o.value]=0;});
      responses.forEach(function(r){var v=r.answers&&r.answers[q.id];if(v==null)return;(Array.isArray(v)?v:[v]).forEach(function(x){if(counts[x]!=null)counts[x]++;});});
      var max=Math.max(1,Math.max.apply(null,opts.map(function(o){return counts[o.value];})));
      head+=opts.map(function(o){var c=counts[o.value];return bar(L(o.label),c,Math.round(c/max*100));}).join('');
    } else if(q.type==='matrix'){
      (q.rows||[]).forEach(function(row){
        head+='<div style="font-weight:600;font-size:13px;margin:12px 0 6px;color:var(--ink-soft)">'+esc(L(row.label))+'</div>';
        var counts={}; (q.columns||[]).forEach(function(c){counts[c.value]=0;});
        responses.forEach(function(r){var v=r.answers&&r.answers[q.id];if(v&&v[row.value]!=null&&counts[v[row.value]]!=null)counts[v[row.value]]++;});
        var max=Math.max(1,Math.max.apply(null,(q.columns||[]).map(function(c){return counts[c.value];})));
        head+=(q.columns||[]).map(function(c){return bar(L(c.label),counts[c.value],Math.round(counts[c.value]/max*100));}).join('');
      });
    } else if(q.type==='ranking'){
      var items=(q.items||[]).slice();
      var scores={},appears={}; items.forEach(function(it){scores[it.value]=0;appears[it.value]=0;});
      responses.forEach(function(r){var ord=r.answers&&r.answers[q.id];if(!Array.isArray(ord))return;
        ord.forEach(function(v,i){if(scores[v]!=null){scores[v]+=(ord.length-i);appears[v]++;}});});
      var ranked=items.slice().sort(function(a,b){return scores[b.value]-scores[a.value];});
      var max=Math.max(1,Math.max.apply(null,items.map(function(it){return scores[it.value];})));
      head+='<div class="muted" style="margin-bottom:10px">Weighted score (higher = ranked more important)</div>';
      head+=ranked.map(function(it){return bar(L(it.label),scores[it.value],Math.round(scores[it.value]/max*100));}).join('');
    } else {
      // text
      var texts=answered.map(function(r){var v=r.answers[q.id]; var ov=r.answers[q.id+'_followup']||r.answers[q.id+'__other']; return (v&&typeof v==='string')?v:(ov||'');}).filter(Boolean);
      head+='<div class="muted" style="margin-bottom:10px">'+texts.length+' text response(s)</div>';
      head+='<div class="txtlist">'+ (texts.length? texts.map(function(x){return '<div class="ti">'+esc(x)+'</div>';}).join('') : '<div class="muted">No responses yet.</div>') +'</div>';
    }
    return head+'</div>';
  }
  function bar(label,n,pct){
    return '<div class="bar-row"><div class="bl">'+esc(label)+'</div><div class="bt"><div class="bf" data-w="'+pct+'" style="width:0"></div></div><div class="bn">'+n+'</div></div>';
  }

  function exportCSV(d,defs){
    var lang=d.definition.default_lang||'en';
    var L=function(o){return o?(o[lang]||o.en||''):'';};
    var headers=['SAI','Focal point','Status','Language','Updated'];
    defs.forEach(function(q){ headers.push('Q'+q.displayNum+(q.hidden?' [hidden]':'')+' '+L(q.label).slice(0,60)); if(q.allow_other)headers.push('Q'+q.displayNum+' other'); if(q.followup)headers.push('Q'+q.displayNum+' followup'); });
    var lines=[headers];
    d.responses.forEach(function(r){
      var row=[r.sai_name||'', (r.answers&&r.answers.q_focal)||'', r.is_complete?'Completed':'Draft', (r.lang||'').toUpperCase(), (r.updated_at||'')];
      defs.forEach(function(q){
        row.push(fmtAns(q,r.answers&&r.answers[q.id],L));
        if(q.allow_other) row.push((r.answers&&r.answers[q.id+'__other'])||'');
        if(q.followup) row.push((r.answers&&r.answers[q.id+'_followup'])||'');
      });
      lines.push(row);
    });
    var csv=lines.map(function(ln){return ln.map(csvCell).join(',');}).join('\r\n');
    var blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=current+'-responses.csv';a.click();
  }
  function fmtAns(q,v,L){
    if(v==null)return'';
    if(q.type==='matrix'){ if(typeof v!=='object')return''; return (q.rows||[]).map(function(row){var c=v[row.value];var cl=(q.columns||[]).filter(function(x){return x.value===c;})[0];return L(row.label)+': '+(cl?L(cl.label):'');}).join(' | '); }
    if(q.type==='ranking'){ if(!Array.isArray(v))return''; var items=q.items||[]; return v.map(function(val,i){var it=items.filter(function(x){return x.value===val;})[0];return (i+1)+'. '+(it?L(it.label):val);}).join(' | '); }
    if(Array.isArray(v)){ return v.map(function(val){ if(val==='__other__')return'Other'; var o=(q.options||[]).filter(function(x){return x.value===val;})[0]; return o?L(o.label):val; }).join(' | '); }
    if(q.type==='single_choice'||q.type==='yes_no'){ var o=(q.options||[{value:'yes',label:{en:'Yes'}},{value:'no',label:{en:'No'}}]).filter(function(x){return x.value===v;})[0]; return o?L(o.label):v; }
    return String(v);
  }
  function csvCell(s){ s=String(s==null?'':s); return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }

  /* ================= Settings tab ================= */
  function pad2(n){ return (n<10?'0':'')+n; }
  // New deadline `n` days after the current one (same Cairo wall-clock time); from today 23:59 if there is none / it has passed.
  function addDaysCairo(iso,n){
    var live = iso && Date.parse(iso)>nowMs();
    var p = cparts(live? iso : new Date(nowMs()).toISOString());
    var time = live ? p.hour+':'+p.minute : '23:59';
    var dt = new Date(Date.UTC(+p.year, +p.month-1, +p.day+n));
    return dt.getUTCFullYear()+'-'+pad2(dt.getUTCMonth()+1)+'-'+pad2(dt.getUTCDate())+'T'+time;
  }

  function patchSurvey(body){
    return api('/api/admin/survey/'+encodeURIComponent(current),{method:'PATCH',body:body}).then(function(r){
      DATA.detail.survey=r.survey;
      var t=r.survey.title;
      if(body.title && ED && ED.slug===current){      // keep the editor's copy of the title in step
        ED.draft.title=clone(t); ED.orig.title=clone(t);
      }
      if(DATA.detail.definition && body.title) DATA.detail.definition.title=clone(t);
      return refreshList().then(function(){ return r; });
    });
  }

  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function rid(n){ var c='abcdefghijklmnopqrstuvwxyz0123456789',s='',i; for(i=0;i<n;i++) s+=c.charAt(Math.floor(Math.random()*c.length)); return s; }
  function getP(o,path){ return path.split('.').reduce(function(a,k){return a==null?a:a[k];},o); }
  function setP(o,path,val){ var ks=path.split('.'),last=ks.pop(); ks.reduce(function(a,k){return a[k];},o)[last]=val; }
  function move(arr,i,dir){ var j=i+dir; if(j<0||j>=arr.length) return; var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }

  function ensureEditor(d){
    if(ED && ED.slug===d.survey.slug){ ED.resp=d.survey.response_count; return; }
    var def=clone(d.definition);
    ED={slug:d.survey.slug,draft:def,orig:clone(def),resp:d.survey.response_count,serverProblems:null};
    // what already exists (and may hold answers): ids, option values, "other", follow-ups
    ED.ids={}; ED.vals={};
    (ED.orig.sections||[]).forEach(function(s){ (s.questions||[]).forEach(function(q){
      ED.ids[q.id]={other:!!q.allow_other,follow:!!q.followup};
      ['options','items','rows','columns'].forEach(function(f){ if(q[f]) ED.vals[q.id+'|'+f]=q[f].map(function(o){return o.value;}); });
    }); });
  }
  function qLocked(q){ return ED.resp>0 && !!ED.ids[q.id]; }
  function entLocked(q,f,o){ return ED.resp>0 && (ED.vals[q.id+'|'+f]||[]).indexOf(o.value)!==-1; }

  function checkDraft(){
    var out=[];
    if(!DefCheck) return out;
    DefCheck.validateDefinition(ED.draft).problems.forEach(function(p){ out.push(p.message); });
    if(ED.resp>0) DefCheck.checkCompatibility(ED.orig,ED.draft).forEach(function(p){ out.push(p.id+': '+p.message); });
    return out;
  }

  function newEntry(label){ return {value:'o_'+rid(6),label:{en:label,ar:''}}; }
  function initType(q,type,keep){
    ['options','items','rows','columns','allow_other','followup','followup_if'].forEach(function(k){ if(!(keep&&keep[k])) delete q[k]; else q[k]=keep[k]; });
    q.type=type;
    if(CHOICE.indexOf(type)>-1 && !q.options) q.options=[newEntry('Option 1'),newEntry('Option 2')];
    if(type==='ranking' && !q.items) q.items=[newEntry('Item 1'),newEntry('Item 2')];
    if(type==='matrix'){ if(!q.rows) q.rows=[newEntry('Statement 1')]; if(!q.columns) q.columns=[{value:'yes',label:{en:'Yes',ar:'نعم'}},{value:'no',label:{en:'No',ar:'لا'}}]; }
  }
  function newQuestion(type){ var q={id:'q_'+rid(8),type:type,required:false,label:{en:'',ar:''}}; initType(q,type); return q; }
  function changeType(q,type){
    var keep=null;
    if(CHOICE.indexOf(q.type)>-1 && CHOICE.indexOf(type)>-1) keep={options:q.options,allow_other:q.allow_other};
    initType(q,type,keep);
  }

  /* ---- rendering ---- */
  function ib(act,data,label,disabled,title,cls){
    var a=''; Object.keys(data||{}).forEach(function(k){ a+=' data-'+k+'="'+esc(data[k])+'"'; });
    return '<button class="ib'+(cls?' '+cls:'')+'" data-act="'+act+'"'+a+(disabled?' disabled':'')+(title?' title="'+esc(title)+'"':'')+'>'+label+'</button>';
  }
  function txt(path,val,ph,rtl){ return '<input data-bind="'+path+'" value="'+esc(val)+'" placeholder="'+esc(ph)+'"'+(rtl?' dir="rtl"':'')+'>'; }

  function entriesHtml(q,si,qi,f,title,addLabel,free){
    var base='sections.'+si+'.questions.'+qi+'.'+f, list=q[f]||[];
    return '<div class="ed-list"><div class="ed-list-hd">'+title+'</div>'+
      list.map(function(o,oi){
        var lk=entLocked(q,f,o), d={si:si,qi:qi,f:f,oi:oi};
        return '<div class="ed-ent">'+txt(base+'.'+oi+'.label.en',(o.label||{}).en||'','English')+txt(base+'.'+oi+'.label.ar',(o.label||{}).ar||'','العربية',true)+
          (free?'<label class="chk" title="Shows a free-text box for this item"><input type="checkbox" data-bind="'+base+'.'+oi+'.is_other"'+(o.is_other?' checked':'')+'> text</label>':'')+
          ib('ent-up',d,'↑',oi===0,'Move up')+ib('ent-down',d,'↓',oi===list.length-1,'Move down')+
          ib('ent-del',d,'✕',lk||list.length<=1,lk?'Cannot be removed once the survey has responses':(list.length<=1?'At least one entry is required':'Remove'),'danger')+'</div>';
      }).join('')+
      '<button class="btn btn-ghost btn-sm" data-act="ent-add" data-si="'+si+'" data-qi="'+qi+'" data-f="'+f+'">+ '+addLabel+'</button></div>';
  }

  function typeBlock(q,si,qi){
    var p='sections.'+si+'.questions.'+qi, info=ED.ids[q.id]||{};
    if(CHOICE.indexOf(q.type)>-1)
      return '<label class="chk"><input type="checkbox" data-bind="'+p+'.allow_other"'+(q.allow_other?' checked':'')+((ED.resp>0&&info.other)?' disabled':'')+'> Offer an “Other (please specify)” option</label>'+
        entriesHtml(q,si,qi,'options','Options','Add option');
    if(q.type==='ranking') return entriesHtml(q,si,qi,'items','Items to rank','Add item',true);
    if(q.type==='matrix') return entriesHtml(q,si,qi,'rows','Rows (statements)','Add row')+entriesHtml(q,si,qi,'columns','Columns (answers)','Add column');
    if(q.type==='yes_no'){
      var lockFu=ED.resp>0&&info.follow, fu=q.followup;
      return '<label class="chk"><input type="checkbox" data-fu="'+si+'.'+qi+'"'+(fu?' checked':'')+(lockFu?' disabled':'')+'> Ask a follow-up question</label>'+
        (fu?'<div class="ed-list"><div class="row" style="margin-bottom:8px"><span class="muted">Ask when the answer is</span>'+
          '<select data-bind="'+p+'.followup_if" style="width:auto"><option value="yes"'+((q.followup_if||'yes')==='yes'?' selected':'')+'>Yes</option><option value="no"'+(q.followup_if==='no'?' selected':'')+'>No</option></select>'+
          '<span class="muted">as</span><select data-bind="'+p+'.followup.type" style="width:auto"><option value="long_text"'+(fu.type==='long_text'?' selected':'')+'>Long text</option><option value="short_text"'+(fu.type==='short_text'?' selected':'')+'>Short text</option></select></div>'+
          '<div class="ed-ent">'+txt(p+'.followup.label.en',(fu.label||{}).en||'','Follow-up (English)')+txt(p+'.followup.label.ar',(fu.label||{}).ar||'','السؤال التالي (العربية)',true)+'</div></div>':'');
    }
    return '';
  }

  function qHtml(q,si,qi,num,count){
    var lk=qLocked(q), isNew=ED.resp>0&&!ED.ids[q.id], p='sections.'+si+'.questions.'+qi, d={si:si,qi:qi};
    var sel='<select data-chtype data-si="'+si+'" data-qi="'+qi+'"'+(lk?' disabled title="The type cannot change once the survey has responses"':'')+'>'+
      QTYPES.map(function(t){return '<option value="'+t[0]+'"'+(q.type===t[0]?' selected':'')+'>'+t[1]+'</option>';}).join('')+'</select>';
    return '<div class="ed-q'+(q.hidden?' is-hidden':'')+'">'+
      '<div class="ed-q-hd"><span class="q-n">Q'+num+'</span><span class="mono">'+esc(q.id)+'</span>'+(q.hidden?'<span class="pill pending">Hidden</span>':'')+(isNew?'<span class="pill started">New</span>':'')+'<span class="sp"></span>'+
        ib('q-up',d,'↑',qi===0,'Move up')+ib('q-down',d,'↓',qi===count-1,'Move down')+
        ib('q-hide',d,q.hidden?'Unhide':'Hide',false,q.hidden?'Show this question to respondents again':'Respondents will no longer see it; existing answers, the dashboard and CSV keep it')+
        ib('q-del',d,'Delete',lk,lk?'Questions of a survey with responses cannot be deleted — use Hide':'Delete this question','danger')+'</div>'+
      '<div class="row" style="margin:8px 0">'+sel+'<label class="chk"><input type="checkbox" data-bind="'+p+'.required"'+(q.required?' checked':'')+'> Required</label></div>'+
      '<div class="grid2">'+txt(p+'.label.en',(q.label||{}).en||'','Question (English)')+txt(p+'.label.ar',(q.label||{}).ar||'','السؤال (العربية)',true)+'</div>'+
      '<div style="margin-top:10px">'+typeBlock(q,si,qi)+'</div></div>';
  }

  function sectionsHtml(){
    var n=0, secs=ED.draft.sections||[];
    return secs.map(function(s,si){
      var lk=ED.resp>0 && (s.questions||[]).some(function(q){return ED.ids[q.id];}), d={si:si};
      var qs=(s.questions||[]).map(function(q,qi){ n++; return qHtml(q,si,qi,n,s.questions.length); }).join('');
      return '<div class="ed-sec"><div class="ed-sec-hd"><b>Section '+(si+1)+'</b><span class="mono">'+esc(s.id)+'</span><span class="sp"></span>'+
          ib('sec-up',d,'↑',si===0,'Move up')+ib('sec-down',d,'↓',si===secs.length-1,'Move down')+
          ib('sec-del',d,'Delete section',lk||secs.length<=1,lk?'This section holds questions of a survey with responses — hide them instead':(secs.length<=1?'A survey needs at least one section':'Delete this section'),'danger')+'</div>'+
        '<div class="grid2">'+txt('sections.'+si+'.title.en',(s.title||{}).en||'','Section title (English)')+txt('sections.'+si+'.title.ar',(s.title||{}).ar||'','عنوان القسم (العربية)',true)+'</div>'+
        qs+
        '<div class="row" style="margin-top:12px"><select data-newtype="'+si+'" style="width:auto">'+QTYPES.map(function(t){return '<option value="'+t[0]+'">'+t[1]+'</option>';}).join('')+'</select>'+
        '<button class="btn btn-ghost btn-sm" data-act="q-add" data-si="'+si+'">+ Add question</button></div></div>';
    }).join('')+'<button class="btn btn-ghost" data-act="sec-add">+ Add section</button>';
  }

  function refreshEdStatus(){
    var probs=(ED.serverProblems&&ED.serverProblems.length)?ED.serverProblems:checkDraft();
    var box=document.getElementById('edProblems'); if(!box) return;
    box.innerHTML=probs.length?'<div class="banner err-b"><b>Fix before saving:</b><ul>'+probs.slice(0,12).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+(probs.length>12?'<li>… and '+(probs.length-12)+' more</li>':'')+'</ul></div>':'';
    var dirty=editorDirty(), save=document.getElementById('edSave'), disc=document.getElementById('edDiscard'), st=document.getElementById('edState');
    if(save) save.disabled=!dirty||checkDraft().length>0;
    if(disc) disc.disabled=!dirty;
    if(st) st.textContent=dirty?'Unsaved changes':'All changes saved';
    var tbtn=document.querySelector('.tabs button[data-t="questions"]'); if(tbtn) tbtn.textContent='Questions'+(dirty?' •':'');
  }
  function drawEditor(){
    document.getElementById('edRoot').innerHTML=sectionsHtml();
    var jb=document.getElementById('jsonBox'); if(jb && !jb.matches(':focus')) jb.value=JSON.stringify(ED.draft,null,2);
    refreshEdStatus();
  }

  function renderQuestions(d){
    ensureEditor(d);
    var tb=document.getElementById('tabBody');
    tb.innerHTML=
      (ED.resp>0?'<div class="banner warn-b"><b>This survey has '+ED.resp+' response'+(ED.resp===1?'':'s')+'.</b> To protect collected data you cannot delete questions or options, change a question’s type, or change option values. '+
        'You can still edit texts, add questions or options, reorder, toggle “Required”, and <b>Hide</b> a question (its answers stay in the dashboard and CSV).</div>':'')+
      (sv_inactive(d)?'<div class="banner info-b">Status is <b>'+esc(d.survey.status)+'</b> — respondents cannot answer yet. Open the Settings tab to activate the survey.</div>':'')+
      '<div id="edProblems"></div>'+
      '<div class="ed-bar"><button class="btn btn-ghost btn-sm" id="edPreview">Preview</button>'+
        '<button class="btn btn-primary btn-sm" id="edSave">Save changes</button>'+
        '<button class="btn btn-ghost btn-sm" id="edDiscard">Discard changes</button><span class="muted" id="edState"></span></div>'+
      '<div id="edRoot"></div>'+
      '<details class="card" id="advBox" style="margin-top:18px"><summary><b>Advanced: JSON</b> <span class="muted">— the raw survey definition, for power users</span></summary>'+
        '<p class="muted" style="margin:10px 0">Edit the JSON and press <b>Apply to editor</b>; it is validated and nothing is saved until you press <b>Save changes</b>. Status, deadline and anonymous access are managed in Settings, not here.</p>'+
        '<textarea id="jsonBox" rows="14" spellcheck="false" style="font-family:ui-monospace,Menlo,monospace;font-size:12px"></textarea>'+
        '<div class="err" id="jsonErr"></div>'+
        '<div class="row" style="margin-top:8px"><button class="btn btn-ghost btn-sm" id="jsonApply">Apply to editor</button><button class="btn btn-ghost btn-sm" id="jsonReset">Reload from editor</button></div></details>'+
      '<div class="card" style="margin-top:18px"><h3>Version history</h3><p class="muted" style="margin-bottom:10px">Each save keeps the previous definition. Restoring also keeps the current one, so it can be undone.</p><div id="verBox"><span class="muted">Loading…</span></div></div>';
    drawEditor();
    loadVersions();

    tb.addEventListener('input',onEdInput);
    tb.addEventListener('change',onEdChange);
    tb.addEventListener('click',onEdClick);
    document.getElementById('edPreview').onclick=openPreview;
    document.getElementById('edSave').onclick=saveEditor;
    document.getElementById('edDiscard').onclick=function(){ if(editorDirty() && !confirm('Discard all unsaved question edits?')) return; ED=null; renderBody(); };
    document.getElementById('jsonReset').onclick=function(){ document.getElementById('jsonBox').value=JSON.stringify(ED.draft,null,2); document.getElementById('jsonErr').textContent=''; };
    document.getElementById('jsonApply').onclick=applyJson;
  }
  function sv_inactive(d){ return d.survey.status!=='active'; }

  function onEdInput(e){
    var t=e.target; if(!t.dataset || !t.dataset.bind || t.type==='checkbox' || t.tagName==='SELECT') return;
    setP(ED.draft,t.dataset.bind,t.value); ED.serverProblems=null; refreshEdStatus();
  }
  function onEdChange(e){
    var t=e.target; if(!t.dataset) return;
    if(t.dataset.bind && (t.type==='checkbox' || t.tagName==='SELECT')){
      var val=t.type==='checkbox'?t.checked:t.value;
      var last=t.dataset.bind.split('.').pop();
      if(t.type==='checkbox' && !val && (last==='is_other'||last==='allow_other')){ delete getP(ED.draft,t.dataset.bind.split('.').slice(0,-1).join('.'))[last]; }
      else setP(ED.draft,t.dataset.bind,val);
      ED.serverProblems=null; refreshEdStatus();
      if(t.tagName==='SELECT' && last==='type') drawEditor();
    } else if(t.dataset.chtype!==undefined){
      changeType(ED.draft.sections[+t.dataset.si].questions[+t.dataset.qi],t.value); ED.serverProblems=null; drawEditor();
    } else if(t.dataset.fu){
      var ij=t.dataset.fu.split('.'), q=ED.draft.sections[+ij[0]].questions[+ij[1]];
      if(t.checked){ q.followup={type:'long_text',label:{en:'',ar:''}}; q.followup_if='yes'; } else { delete q.followup; delete q.followup_if; }
      ED.serverProblems=null; drawEditor();
    }
  }
  function onEdClick(e){
    var b=e.target.closest('[data-act]'); if(!b || b.disabled) return;
    var act=b.dataset.act, secs=ED.draft.sections, si=+b.dataset.si, qi=+b.dataset.qi, f=b.dataset.f, oi=+b.dataset.oi;
    var s=secs[si], q=s&&s.questions?s.questions[qi]:null;
    switch(act){
      case 'sec-add': secs.push({id:'s_'+rid(6),title:{en:'New section',ar:''},questions:[]}); break;
      case 'sec-up': move(secs,si,-1); break;
      case 'sec-down': move(secs,si,1); break;
      case 'sec-del': if(!confirm('Delete this section'+(s.questions.length?' and its '+s.questions.length+' question(s)':'')+'?')) return; secs.splice(si,1); break;
      case 'q-add': var sel=document.querySelector('select[data-newtype="'+si+'"]'); s.questions.push(newQuestion(sel?sel.value:'short_text')); break;
      case 'q-up': move(s.questions,qi,-1); break;
      case 'q-down': move(s.questions,qi,1); break;
      case 'q-hide': if(q.hidden) delete q.hidden; else q.hidden=true; break;
      case 'q-del': if(!confirm('Delete this question?')) return; s.questions.splice(qi,1); break;
      case 'ent-add': q[f].push(newEntry(f==='columns'?'Answer':f==='rows'?'Statement':f==='items'?'Item':'Option')); break;
      case 'ent-up': move(q[f],oi,-1); break;
      case 'ent-down': move(q[f],oi,1); break;
      case 'ent-del': q[f].splice(oi,1); break;
      default: return;
    }
    ED.serverProblems=null; drawEditor();
  }

  function applyJson(){
    var err=document.getElementById('jsonErr'), def;
    try{ def=JSON.parse(document.getElementById('jsonBox').value); }catch(x){ err.textContent='Not valid JSON: '+x.message; return; }
    if(def.slug!==current){ err.textContent='The "slug" must stay "'+current+'".'; return; }
    if(DefCheck){
      var v=DefCheck.validateDefinition(def);
      if(!v.ok){ err.textContent=v.problems.slice(0,6).map(function(p){return p.message;}).join(' · '); return; }
    }
    ED.draft=def; ED.serverProblems=null; err.textContent=''; drawEditor(); toast('JSON applied to the editor — not saved yet');
  }

  function saveEditor(){
    var probs=checkDraft(); if(probs.length){ toast('Fix the listed problems first',3500); return; }
    var btn=document.getElementById('edSave'); btn.disabled=true;
    api('/api/admin/survey/'+encodeURIComponent(current)+'/definition',{method:'PUT',body:{definition:ED.draft,note:'Edited in admin'}})
      .then(function(r){ ED=null; return loadSurvey(current).then(function(){ toast(r.unchanged?'Nothing to save — no changes':'Saved. Previous version kept in history',3000); }); })
      .catch(function(e){
        var list=(e.body&&e.body.problems)?e.body.problems.map(function(p){return p.id?p.id+': '+p.message:p.message;}):[errText(e)];
        ED.serverProblems=list; refreshEdStatus(); btn.disabled=false; toast(errText(e),5000);
      });
  }

  /* ---- live preview (renders the draft in the real survey renderer, saves nothing) ---- */
  function openPreview(){
    if(checkDraft().length) toast('The draft has problems — the preview may look incomplete',3500);
    var body=openModal('Preview — nothing is saved or sent','<iframe id="pvFrame" src="/survey.html#preview" title="Survey preview"></iframe>',true);
    var frame=body.querySelector('#pvFrame');
    function send(){ if(frame.contentWindow) frame.contentWindow.postMessage({type:'survey-preview',definition:clone(ED.draft)},location.origin); }
    previewListener=function(e){ if(e.origin===location.origin && e.data && e.data.type==='survey-preview-ready') send(); };
    window.addEventListener('message',previewListener);
    frame.addEventListener('load',function(){ setTimeout(send,60); });
  }

  /* ---- version history ---- */
  function loadVersions(){
    var slug=current;
    api('/api/admin/survey/'+encodeURIComponent(slug)+'/versions').then(function(r){
      var box=document.getElementById('verBox'); if(!box || current!==slug) return;
      box.innerHTML=r.versions.length?
        '<table><thead><tr><th>Version</th><th>Saved</th><th>Note</th><th>Contents</th><th></th></tr></thead><tbody>'+r.versions.map(function(v){
          return '<tr><td>v'+v.version+'</td><td class="mono">'+esc((v.saved_at||'').slice(0,16))+' UTC</td><td>'+esc(v.note||'')+'</td><td class="muted">'+v.sections+' sections · '+v.questions+' questions</td>'+
            '<td><span class="copy" data-restore="'+v.version+'">Restore</span></td></tr>';
        }).join('')+'</tbody></table>':'<span class="muted">No earlier versions yet — the first save creates one.</span>';
      [].forEach.call(box.querySelectorAll('[data-restore]'),function(el){ el.onclick=function(){ restoreVersion(+el.dataset.restore); }; });
    }).catch(function(e){ var box=document.getElementById('verBox'); if(box) box.innerHTML='<span class="muted">Could not load versions: '+esc(errText(e))+'</span>'; });
  }
  function restoreVersion(n){
    if(!confirm('Restore version '+n+'?\nThe current definition is kept as a new version.'+(editorDirty()?'\nUnsaved editor changes will be discarded.':''))) return;
    api('/api/admin/survey/'+encodeURIComponent(current)+'/restore/'+n,{method:'POST'})
      .then(function(){ ED=null; return loadSurvey(current); }).then(function(){ toast('Version '+n+' restored'); })
      .catch(function(e){
        var extra=(e.body&&e.body.problems)?'\n\n'+e.body.problems.map(function(p){return '• '+(p.id?p.id+': ':'')+p.message;}).join('\n'):'';
        alert('Could not restore: '+errText(e)+extra);
      });
  }

  /* ---------- utils ---------- */
  function flatten(def){ var n=0,out=[]; (def.sections||[]).forEach(function(s){(s.questions||[]).forEach(function(q){n++;q.displayNum=n;out.push(q);});}); return out; }

  function start(){ if(TOKEN){ boot().catch(function(){renderLogin();}); } else { renderLogin(); } }
  // The validator is shared with the Worker (site/definition.js); the editor still works without it.
  import('/definition.js').then(function(m){ DefCheck=m; }).catch(function(){}).then(start);
})();
</script>
</body>
