<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="mark serif">S</div>
      <div class="bt">
        <b id="brand-title">SAI Egypt · Surveys</b>
        <span id="brand-sub">Supreme Audit Institutions</span>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="lang-toggle" id="langToggle">
      <button data-l="en">EN</button>
      <button data-l="ar">عربي</button>
    </div>
  </div>
  <div class="progress-rail"><div class="progress-fill" id="progressFill"></div></div>
</header>

<main id="root"><div class="boot-loading" id="bootLoading" role="status">
  <div class="spinner" aria-hidden="true"></div>
  <p>Loading the questionnaire…</p>
  <p dir="rtl" lang="ar">جارٍ تحميل الاستبيان…</p>
  <p class="boot-slow" id="bootSlow" hidden>This is taking longer than usual — please wait a moment.<br><span dir="rtl" lang="ar">يستغرق الأمر وقتًا أطول من المعتاد — يرجى الانتظار قليلًا.</span></p>
</div></main>
<noscript><p style="padding:24px;text-align:center">Please enable JavaScript to open this questionnaire. · يرجى تفعيل JavaScript لفتح هذا الاستبيان.</p></noscript>
<div class="toast" id="toast"></div>

<script src="/config.js"></script>
<script src="/app.js"></script>
</body>
</html>
